<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Тренировочный счетчик</title>
  <style>
    * { box-sizing: border-box; touch-action: manipulation; user-select: none; }
    body {
      margin: 0;
      padding: 16px;
      background: #121212;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    h1 { font-size: 20px; margin: 0; font-weight: 600; }
    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(2, 1fr);
      gap: 16px;
      flex: 1;
    }
    .player-btn {
      background: #1e1e1e;
      border: 3px solid #333;
      border-radius: 18px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      transition: background 0.08s, transform 0.08s;
      -webkit-tap-highlight-color: transparent;
    }
    .player-btn:active {
      background: #2a2a2a;
      border-color: #00e676;
      transform: scale(0.98);
    }
    .player-name {
      font-size: 24px;
      color: #aaa;
      margin-bottom: 8px;
      font-weight: 500;
    }
    .player-score {
      font-size: 64px;
      font-weight: 800;
      color: #00e676;
    }
    footer {
      display: flex;
      gap: 12px;
      margin-top: 14px;
    }
    .action-btn {
      flex: 1;
      padding: 16px;
      font-size: 18px;
      font-weight: 600;
      border-radius: 12px;
      border: none;
      cursor: pointer;
    }
    .btn-send { background: #0088cc; color: white; }
    .btn-reset { background: #333; color: #ff5252; max-width: 140px; }
  </style>
</head>
<body>

  <header>
    <h1>Счетчик упражнения</h1>
    <span id="status" style="font-size: 14px; color: #888;">Готов к работе</span>
  </header>

  <div class="grid">
    <!-- Кнопки 6 игроков -->
    <div class="player-btn" onclick="addPoint(0)">
      <div class="player-name">Игрок 1</div>
      <div class="player-score" id="score-0">0</div>
    </div>
    <div class="player-btn" onclick="addPoint(1)">
      <div class="player-name">Игрок 2</div>
      <div class="player-score" id="score-1">0</div>
    </div>
    <div class="player-btn" onclick="addPoint(2)">
      <div class="player-name">Игрок 3</div>
      <div class="player-score" id="score-2">0</div>
    </div>
    <div class="player-btn" onclick="addPoint(3)">
      <div class="player-name">Игрок 4</div>
      <div class="player-score" id="score-3">0</div>
    </div>
    <div class="player-btn" onclick="addPoint(4)">
      <div class="player-name">Игрок 5</div>
      <div class="player-score" id="score-4">0</div>
    </div>
    <div class="player-btn" onclick="addPoint(5)">
      <div class="player-name">Игрок 6</div>
      <div class="player-score" id="score-5">0</div>
    </div>
  </div>

  <footer>
    <button class="action-btn btn-reset" onclick="resetScores()">Сброс</button>
    <button class="action-btn btn-send" onclick="sendToTelegram()">Отправить в Telegram</button>
  </footer>

  <script>
    // Параметры Telegram (заполняются своими данными)
    const TG_BOT_TOKEN = "ВАШ_BOT_TOKEN";
    const TG_CHAT_ID = "@ваш_канал_или_chat_id";

    const players = ["Игрок 1", "Игрок 2", "Игрок 3", "Игрок 4", "Игрок 5", "Игрок 6"];
    let scores = [0, 0, 0, 0, 0, 0];

    // Аудио-контекст для моментального сигнала без загрузки файлов
    let audioCtx = null;

    function playTone() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = "sine";
      osc.frequency.setValueAtTime(880, audioCtx.currentTime); // 880 Гц (нота Ля)
      gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.12);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.12);
    }

    function addPoint(index) {
      scores[index]++;
      document.getElementById(`score-${index}`).innerText = scores[index];
      playTone();
    }

    function resetScores() {
      if (!confirm("Сбросить все очки?")) return;
      scores = [0, 0, 0, 0, 0, 0];
      scores.forEach((_, i) => document.getElementById(`score-${i}`).innerText = "0");
      document.getElementById("status").innerText = "Сброшено";
    }

    async function sendToTelegram() {
      const statusEl = document.getElementById("status");
      statusEl.innerText = "Отправка...";

      let text = "🏆 <b>Результаты упражнения:</b>\n\n";
      players.forEach((p, i) => {
        text += `• <b>${p}:</b> ${scores[i]}\n`;
      });

      if (!TG_BOT_TOKEN || TG_BOT_TOKEN.includes("ВАШ_BOT_TOKEN")) {
        alert("Токен Telegram не настроен. Результаты скопированы в буфер:\n\n" + text.replace(/<[^>]*>/g, ''));
        navigator.clipboard.writeText(text.replace(/<[^>]*>/g, ''));
        statusEl.innerText = "Скопировано в буфер";
        return;
      }

      try {
        const url = `https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage`;
        const res = await fetch(url, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            chat_id: TG_CHAT_ID,
            text: text,
            parse_mode: "HTML"
          })
        });

        if (res.ok) {
          statusEl.innerText = "Успешно отправлено!";
          alert("Результаты отправлены в канал!");
        } else {
          throw new Error("Ошибка Telegram API");
        }
      } catch (err) {
        statusEl.innerText = "Ошибка отправки";
        alert("Не удалось отправить. Проверьте интернет или настройки бота.");
      }
    }
  </script>
</body>
</html>
